# =============================================================================
# 手动 Release 构建工作流
#
# 触发方式: 手动 (workflow_dispatch)
# 行为:
#   1. 拉取代码
#   2. 自动计算版本号（上一个 tag + 0.0.1，10进制满10进1，起始 1.0.0）
#   3. 校验随仓库入库的公开签名密钥 cert/my.jks
#   4. Release 构建 (assembleRelease) + 对齐 + 签名
#   5. 将签名后的 APK 发布到 GitHub Release
#
# 约束:
#   - ❌ 仅拉取代码，不推送任何变更到分支
#   - 🔑 使用固定密钥 cert/my.jks 签名（保证升级安装时签名一致）
#   - 🔓 该密钥库**公开**、随仓库入库，密码为固定值，不用 Secret
# =============================================================================

name: Release Build

on:
  workflow_dispatch:
    inputs:
      note:
        description: '构建备注（选填，出现在 Release 标题中）'
        required: false
        type: string

permissions:
  contents: write

jobs:
  build:
    name: Release Build
    runs-on: ubuntu-latest

    steps:
      # ── 1. 拉取代码（含所有标签历史）──────────────────────────────
      - name: Checkout code
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      # ── 2. 计算下一个版本号 ──────────────────────────────────────
      - name: Calculate next version
        id: version
        run: |
          LATEST_TAG=$(git tag --sort=-version:refname | head -n1)

          if [ -z "$LATEST_TAG" ]; then
            MAJOR=1
            MINOR=0
            PATCH=0
          else
            TAG="${LATEST_TAG#v}"
            IFS='.' read -r MAJOR MINOR PATCH <<< "$TAG"

            if ! [[ "$MAJOR" =~ ^[0-9]+$ ]] || \
               ! [[ "$MINOR" =~ ^[0-9]+$ ]] || \
               ! [[ "$PATCH" =~ ^[0-9]+$ ]]; then
              echo "::error::Latest tag '$LATEST_TAG' is not a valid semver (X.Y.Z)"
              exit 1
            fi

            # 10进制：PATCH+1，满10进1
            PATCH=$((PATCH + 1))
            if [ "$PATCH" -ge 10 ]; then
              PATCH=0
              MINOR=$((MINOR + 1))
            fi
          fi

          NEW_VERSION="${MAJOR}.${MINOR}.${PATCH}"
          echo "version=${NEW_VERSION}" >> "$GITHUB_OUTPUT"
          echo "Previous tag: ${LATEST_TAG:-<none>}"
          echo "New version:  ${NEW_VERSION}"

      # ── 3. 环境准备 ───────────────────────────────────────────────
      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: 'zulu'
          java-version: '17'

      # 不使用 android-actions/setup-android：该 action 在 runner 上偶发失败
      # （本次 run 在第 5 步 "Setup Android SDK" 直接失败，导致后续全部 skipped，16 秒即结束）。
      # runner 镜像已自带 Android SDK，这里只做校验并按需补装构建所需组件。
      - name: Verify Android SDK
        run: |
          SDK="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          if [ ! -d "$SDK" ]; then
            echo "::error::Android SDK not found at $SDK"
            exit 1
          fi
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"
          echo "SDK: $SDK"

          SDKMANAGER="$SDK/cmdline-tools/latest/bin/sdkmanager"
          if [ -x "$SDKMANAGER" ]; then
            # 工程使用 AGP 9 的新 DSL：compileSdk = release(37)
            yes | "$SDKMANAGER" --licenses > /dev/null 2>&1 || true
            "$SDKMANAGER" "platforms;android-37" "build-tools;37.0.0" > /dev/null 2>&1 \
              && echo "Installed platforms;android-37 + build-tools;37.0.0" \
              || echo "::warning::sdkmanager install failed; relying on preinstalled SDK"
          else
            echo "::warning::sdkmanager not found; relying on preinstalled SDK"
          fi

          echo "--- platforms ---"
          ls -1 "$SDK/platforms" 2>/dev/null || true
          echo "--- build-tools ---"
          ls -1 "$SDK/build-tools" 2>/dev/null || true

      - name: Setup Gradle with cache
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-home-cache-cleanup: true

      # ── 4. Gradle 镜像配置（阿里云 mirror） ─────────────────────
      # 不改代码，通过 init 脚本在 CI 层面替换 Maven Central → 阿里云
      - name: Create Gradle init script with Aliyun mirror
        run: |
          cat > init-ci.gradle << 'SCRIPT'
          // CI 镜像配置 — 仅 CI 环境生效，不碰项目代码
          gradle.settingsEvaluated { settings ->
            settings.pluginManagement.repositories.each { repo ->
              if (repo instanceof MavenArtifactRepository) {
                if (repo.url.toString().contains('repo.maven.apache.org')) {
                  repo.setUrl('https://maven.aliyun.com/repository/public')
                }
                if (repo.url.toString().contains('maven.google.com') || repo.url.toString().contains('dl.google.com')) {
                  repo.setUrl('https://maven.aliyun.com/repository/google')
                }
              }
            }
          }

          gradle.projectsLoaded { g ->
            g.rootProject.buildscript.repositories.each { repo ->
              if (repo instanceof MavenArtifactRepository) {
                if (repo.url.toString().contains('repo.maven.apache.org')) {
                  repo.setUrl('https://maven.aliyun.com/repository/public')
                }
                if (repo.url.toString().contains('maven.google.com') || repo.url.toString().contains('dl.google.com')) {
                  repo.setUrl('https://maven.aliyun.com/repository/google')
                }
              }
            }
            g.rootProject.repositories.each { repo ->
              if (repo instanceof MavenArtifactRepository) {
                if (repo.url.toString().contains('repo.maven.apache.org')) {
                  repo.setUrl('https://maven.aliyun.com/repository/public')
                }
                if (repo.url.toString().contains('maven.google.com') || repo.url.toString().contains('dl.google.com')) {
                  repo.setUrl('https://maven.aliyun.com/repository/google')
                }
              }
            }
          }
          SCRIPT
          echo "init-ci.gradle created"

      # ── 5. 校验签名密钥 ─────────────────────────────────────────
      # cert/my.jks 是**公开**的固定密钥，已直接入库（开源项目，任何人可自行构建）。
      # 它是自签名密钥、不用于分发凭证，公开不构成风险；
      # 但必须保持固定，才能让新 APK 覆盖安装老版本（Android 要求签名一致）。
      - name: Verify signing keystore
        run: |
          if [ ! -f cert/my.jks ]; then
            echo "::error::cert/my.jks 不存在（应随仓库一起检出）"
            exit 1
          fi
          echo "Keystore: $(stat -c%s cert/my.jks) bytes"
          keytool -list -keystore cert/my.jks -storepass '123456' > /dev/null \
            && echo "Keystore verified" \
            || { echo "::error::密钥库校验失败"; exit 1; }

      # ── 6. 注入版本号 + Release 构建 ────────────────────────────
      - name: Inject versionName for build
        run: |
          sed -i \
            "s/versionName = \".*\"/versionName = \"${{ steps.version.outputs.version }}\"/" \
            app/build.gradle.kts
          echo "Injected versionName = ${{ steps.version.outputs.version }}"

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build unsigned Release APK
        run: ./gradlew -I init-ci.gradle assembleRelease

      # ── 7. 对齐 + 签名 APK ──────────────────────────────────────
      - name: Sign APK with apksigner
        env:
          # 公开密钥库的固定口令与别名（非机密，见 README「签名与发布」）
          KEYSTORE_PASSWORD: '123456'
          KEYSTORE_ALIAS: key0
        run: |
          SDK="${ANDROID_HOME:-${ANDROID_SDK_ROOT}}"
          if [ -z "$SDK" ] || [ ! -d "$SDK/build-tools" ]; then
            echo "::error::Android SDK/build-tools not found (ANDROID_HOME=$SDK)"
            exit 1
          fi
          BUILD_TOOLS=$(ls -1d "$SDK"/build-tools/* | sort -V | tail -n1)
          APKSIGNER="$BUILD_TOOLS/apksigner"
          echo "Using build-tools: $BUILD_TOOLS"

          # Do not hard-code the output directory: AGP 9 emits release artifacts under
          # app/release/ on some versions and app/build/outputs/apk/release/ on others.
          UNSIGNED_APK=$(find app -type f -name 'app-release*.apk' \
            ! -name '*-aligned.apk' ! -name '*-signed.apk' | head -n1)
          if [ -z "$UNSIGNED_APK" ]; then
            echo "::error::No APK found to sign"
            find app -type f -name '*.apk' || true
            exit 1
          fi
          echo "Unsigned APK: $UNSIGNED_APK"

          OUT_DIR=$(dirname "$UNSIGNED_APK")
          ALIGNED_APK="${UNSIGNED_APK%.apk}-aligned.apk"
          SIGNED_APK="$OUT_DIR/app-release-signed.apk"

          "${BUILD_TOOLS}/zipalign" -p -v 4 "$UNSIGNED_APK" "$ALIGNED_APK"

          # 公开的固定密钥（PKCS12：store 与 key 共用同一口令）。
          # 固定不变，才能覆盖安装历史版本。
          KEYPASS="$KEYSTORE_PASSWORD"

          "$APKSIGNER" sign \
            --ks cert/my.jks \
            --ks-pass "pass:$KEYSTORE_PASSWORD" \
            --ks-key-alias "$KEYSTORE_ALIAS" \
            --key-pass "pass:$KEYPASS" \
            --out "$SIGNED_APK" \
            "$ALIGNED_APK"

          echo "Verify signature:"
          "$APKSIGNER" verify --print-certs "$SIGNED_APK" | head -n 5 || {
            echo "::error::Signature verification failed"
            exit 1
          }

          echo "Signed APK: $SIGNED_APK"

      # ── 8. 发布到 GitHub Release ─────────────────────────────────
      - name: Create GitHub Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          SIGNED_APK=$(find app -type f -name 'app-release-signed.apk' | head -n1)
          if [ -z "$SIGNED_APK" ] || [ ! -f "$SIGNED_APK" ]; then
            echo "::error::Signed APK not found"
            exit 1
          fi

          VERSION="${{ steps.version.outputs.version }}"
          NOTE="${{ inputs.note || '' }}"

          if [ -n "$NOTE" ]; then
            RELEASE_TITLE="v${VERSION} — ${NOTE}"
          else
            RELEASE_TITLE="v${VERSION}"
          fi

          gh release create "$VERSION" \
            "$SIGNED_APK" \
            --title "$RELEASE_TITLE" \
            --generate-notes

          echo "Published: $RELEASE_TITLE"
